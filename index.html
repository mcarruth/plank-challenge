<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>30-Day Plank Challenge</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icon-192.svg">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
      padding-bottom: 100px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #e94560, #f39c12);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: #8892b0;
      font-size: 0.9rem;
      margin-bottom: 30px;
    }

    .timer-section {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .day-indicator {
      text-align: center;
      font-size: 1.2rem;
      color: #e94560;
      margin-bottom: 10px;
      font-weight: 600;
    }

    .target-time {
      text-align: center;
      color: #8892b0;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .timer-display {
      text-align: center;
      font-size: 5rem;
      font-weight: 700;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
      margin-bottom: 30px;
      line-height: 1;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 15px 30px;
      border: none;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #e94560, #f39c12);
      color: #fff;
      min-width: 140px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(233, 69, 96, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-complete {
      background: linear-gradient(135deg, #00b894, #00cec9);
      color: #fff;
      width: 100%;
      margin-top: 10px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .progress-section {
      margin-top: 20px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .progress-title {
      font-size: 1rem;
      color: #8892b0;
    }

    .progress-count {
      font-size: 0.9rem;
      color: #e94560;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .day-box {
      aspect-ratio: 1;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .day-box:hover {
      transform: scale(1.1);
      border-color: rgba(233, 69, 96, 0.5);
    }

    .day-box.completed {
      background: linear-gradient(135deg, #00b894, #00cec9);
      border-color: transparent;
    }

    .day-box.current {
      background: linear-gradient(135deg, #e94560, #f39c12);
      border-color: transparent;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(233, 69, 96, 0.4); }
      50% { box-shadow: 0 0 0 10px rgba(233, 69, 96, 0); }
    }

    .celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.8);
      z-index: 1000;
    }

    .celebration.active {
      display: flex;
    }

    .celebration-content {
      text-align: center;
      animation: bounceIn 0.5s ease;
    }

    @keyframes bounceIn {
      0% { transform: scale(0); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .celebration-emoji {
      font-size: 5rem;
      margin-bottom: 20px;
    }

    .celebration-text {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }

    .tip {
      text-align: center;
      color: #8892b0;
      font-size: 0.8rem;
      margin-top: 20px;
      font-style: italic;
    }

    .completed-message {
      text-align: center;
      padding: 40px 20px;
    }

    .completed-message h2 {
      font-size: 2rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00b894, #00cec9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .reset-btn {
      margin-top: 20px;
      background: rgba(233, 69, 96, 0.2);
      border: 1px solid #e94560;
      color: #e94560;
    }

    .current-day-display {
      text-align: center;
      padding: 15px;
      background: rgba(233, 69, 96, 0.1);
      border-radius: 10px;
      margin-bottom: 20px;
      border: 1px solid rgba(233, 69, 96, 0.3);
    }

    .current-day-display strong {
      color: #e94560;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>30-Day Plank Challenge</h1>
    <p class="subtitle">Build your core strength, one day at a time</p>

    <div class="current-day-display">
      You're on <strong>Day <span id="currentDayNumber">1</span></strong> — <span id="currentDayTime">0:30</span> plank
    </div>

    <div class="timer-section">
      <div class="day-indicator">Day <span id="dayNumber">1</span></div>
      <div class="target-time">Target: <span id="targetTime">0:30</span></div>
      <div class="timer-display" id="timerDisplay">0:30</div>
      <div class="controls">
        <button class="btn btn-primary" id="startBtn">Start</button>
        <button class="btn btn-secondary" id="resetBtn">Reset</button>
      </div>
      <button class="btn btn-complete" id="completeBtn" disabled>Mark Complete</button>
    </div>

    <div class="progress-section">
      <div class="progress-header">
        <span class="progress-title">Your Progress</span>
        <span class="progress-count"><span id="completedCount">0</span>/30 days</span>
      </div>
      <div class="days-grid" id="daysGrid"></div>
    </div>

    <p class="tip">Tip: Long-press any day to set a custom time</p>
  </div>

  <div class="celebration" id="celebration">
    <div class="celebration-content">
      <div class="celebration-emoji">🎉</div>
      <div class="celebration-text">Day Complete!</div>
      <button class="btn btn-primary" id="celebrationClose">Continue</button>
    </div>
  </div>

  <script>
    // Plank times for each day (in seconds)
    const plankPlan = [
      30, 30, 35, 35, 40,           // Days 1-5
      40, 45, 50, 55, 60,           // Days 6-10
      60, 75, 75, 90, 90,           // Days 11-15
      100, 100, 110, 120, 120,      // Days 16-20
      135, 150, 150, 165, 180,      // Days 21-25
      180, 200, 210, 225, 240       // Days 26-30
    ];

    let currentDay = 1;
    let completedDays = new Set();
    let timeRemaining = 0;
    let isRunning = false;
    let timerInterval = null;
    let customTimes = {};
    let longPressTimer = null;

    // DOM Elements
    const timerDisplay = document.getElementById('timerDisplay');
    const dayNumber = document.getElementById('dayNumber');
    const targetTime = document.getElementById('targetTime');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');
    const completeBtn = document.getElementById('completeBtn');
    const daysGrid = document.getElementById('daysGrid');
    const completedCount = document.getElementById('completedCount');
    const celebration = document.getElementById('celebration');
    const celebrationClose = document.getElementById('celebrationClose');
    const currentDayNumber = document.getElementById('currentDayNumber');
    const currentDayTime = document.getElementById('currentDayTime');

    // Audio context for beep
    let audioContext = null;

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      return audioContext;
    }

    function playBeep(frequency = 800, duration = 200) {
      try {
        const ctx = getAudioContext();
        const oscillator = ctx.createOscillator();
        const gainNode = ctx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(ctx.destination);

        oscillator.frequency.value = frequency;
        oscillator.type = 'sine';

        gainNode.gain.setValueAtTime(0.3, ctx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration / 1000);

        oscillator.start(ctx.currentTime);
        oscillator.stop(ctx.currentTime + duration / 1000);
      } catch (e) {
        console.log('Audio not available');
      }
    }

    function playCompletionSound() {
      playBeep(523, 150);
      setTimeout(() => playBeep(659, 150), 150);
      setTimeout(() => playBeep(784, 300), 300);
    }

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function getTimeForDay(day) {
      if (customTimes[day]) return customTimes[day];
      return plankPlan[day - 1] || 30;
    }

    function loadProgress() {
      try {
        const saved = localStorage.getItem('plankChallenge');
        if (saved) {
          const data = JSON.parse(saved);
          completedDays = new Set(data.completedDays || []);
          currentDay = data.currentDay || 1;
          customTimes = data.customTimes || {};

          // Validate currentDay
          if (currentDay < 1) currentDay = 1;
          if (currentDay > 30) currentDay = 30;
        }
      } catch (e) {
        console.error('Error loading progress:', e);
        completedDays = new Set();
        currentDay = 1;
        customTimes = {};
      }
    }

    function saveProgress() {
      try {
        const data = {
          completedDays: Array.from(completedDays),
          currentDay: currentDay,
          customTimes: customTimes,
          lastSaved: new Date().toISOString()
        };
        localStorage.setItem('plankChallenge', JSON.stringify(data));
      } catch (e) {
        console.error('Error saving progress:', e);
      }
    }

    function selectDay(day) {
      currentDay = day;
      saveProgress();
      updateDisplay();
      resetTimer();
    }

    function updateDisplay() {
      const time = getTimeForDay(currentDay);
      dayNumber.textContent = currentDay;
      targetTime.textContent = formatTime(time);
      currentDayNumber.textContent = currentDay;
      currentDayTime.textContent = formatTime(time);

      if (!isRunning) {
        timeRemaining = time;
        timerDisplay.textContent = formatTime(timeRemaining);
      }

      completedCount.textContent = completedDays.size;
      renderDaysGrid();
    }

    function renderDaysGrid() {
      daysGrid.innerHTML = '';
      for (let i = 1; i <= 30; i++) {
        const dayBox = document.createElement('div');
        dayBox.className = 'day-box';
        dayBox.textContent = i;

        if (completedDays.has(i)) {
          dayBox.classList.add('completed');
        }
        if (i === currentDay) {
          dayBox.classList.add('current');
        }

        // Click to select day
        dayBox.addEventListener('click', () => selectDay(i));

        // Long press for custom time
        dayBox.addEventListener('mousedown', (e) => startLongPress(e, i));
        dayBox.addEventListener('mouseup', cancelLongPress);
        dayBox.addEventListener('mouseleave', cancelLongPress);
        dayBox.addEventListener('touchstart', (e) => startLongPress(e, i));
        dayBox.addEventListener('touchend', cancelLongPress);
        dayBox.addEventListener('touchcancel', cancelLongPress);

        daysGrid.appendChild(dayBox);
      }
    }

    function startLongPress(e, day) {
      longPressTimer = setTimeout(() => {
        const currentTime = getTimeForDay(day);
        const input = prompt(`Set custom time for Day ${day} (in seconds):`, currentTime);
        if (input !== null) {
          const newTime = parseInt(input);
          if (!isNaN(newTime) && newTime > 0 && newTime <= 600) {
            customTimes[day] = newTime;
            saveProgress();
            updateDisplay();
          } else if (input !== '') {
            alert('Please enter a valid time (1-600 seconds)');
          }
        }
      }, 800);
    }

    function cancelLongPress() {
      if (longPressTimer) {
        clearTimeout(longPressTimer);
        longPressTimer = null;
      }
    }

    function startTimer() {
      if (isRunning) {
        // Pause
        clearInterval(timerInterval);
        isRunning = false;
        startBtn.textContent = 'Resume';
      } else {
        // Start/Resume
        isRunning = true;
        startBtn.textContent = 'Pause';

        timerInterval = setInterval(() => {
          timeRemaining--;
          timerDisplay.textContent = formatTime(timeRemaining);

          if (timeRemaining <= 3 && timeRemaining > 0) {
            playBeep(600, 100);
          }

          if (timeRemaining <= 0) {
            clearInterval(timerInterval);
            isRunning = false;
            startBtn.textContent = 'Start';
            startBtn.disabled = true;
            completeBtn.disabled = false;
            playCompletionSound();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      isRunning = false;
      timeRemaining = getTimeForDay(currentDay);
      timerDisplay.textContent = formatTime(timeRemaining);
      startBtn.textContent = 'Start';
      startBtn.disabled = false;
      completeBtn.disabled = true;
    }

    function markComplete() {
      completedDays.add(currentDay);

      // Auto-advance to next incomplete day
      let nextDay = currentDay + 1;
      while (nextDay <= 30 && completedDays.has(nextDay)) {
        nextDay++;
      }
      if (nextDay <= 30) {
        currentDay = nextDay;
      }

      saveProgress();

      // Show celebration
      celebration.classList.add('active');

      updateDisplay();
      resetTimer();
    }

    function closeCelebration() {
      celebration.classList.remove('active');
    }

    function checkAllComplete() {
      if (completedDays.size === 30) {
        return true;
      }
      return false;
    }

    // Event Listeners
    startBtn.addEventListener('click', startTimer);
    resetBtn.addEventListener('click', resetTimer);
    completeBtn.addEventListener('click', markComplete);
    celebrationClose.addEventListener('click', closeCelebration);
    celebration.addEventListener('click', (e) => {
      if (e.target === celebration) closeCelebration();
    });

    // Initialize
    loadProgress();
    updateDisplay();

    // Log current state for debugging
    console.log('Plank Challenge loaded');
    console.log('Current day:', currentDay);
    console.log('Completed days:', Array.from(completedDays));
  </script>
</body>
</html>
